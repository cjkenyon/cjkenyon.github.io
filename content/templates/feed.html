{% extends "base.html" %}

{% block content %}
<ul class="post-list">
  {% for entry in entries %}
  <li>
    <h2>
      <a href="{{ entry.url }}">{{ entry.title }}</a>
    </h2>
    <span class="feed-author">{{ entry.author }},</span>
    <time>{{ entry.date_str }}</time>
  </li>
  {% endfor %}
</ul>
{% endblock %}
